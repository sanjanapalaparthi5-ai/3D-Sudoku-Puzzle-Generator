<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>

<style>
body{
  margin:0;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:linear-gradient(to right,#dfe9f3,#ffffff);
}

.container{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1{
  margin-bottom:10px;
}

.status{
  margin:10px;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,100px);
  gap:10px;
  margin:20px 0;
}

.cell{
  width:100px;
  height:100px;
  background:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  cursor:pointer;
  border-radius:10px;
}

button{
  padding:10px 20px;
  border:none;
  background:#333;
  color:white;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>Tic Tac Toe</h1>

<div class="status" id="status">Player X Turn</div>

<div class="grid" id="grid"></div>

<button onclick="reset()">New Game</button>

</div>

<script>

let board=["","","","","","","","",""];
let current="X";

function createGrid(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  board.forEach((val,i)=>{
    const cell=document.createElement("div");
    cell.className="cell";
    cell.innerText=val;
    cell.onclick=()=>play(i);
    grid.appendChild(cell);
  });
}

function play(i){
  if(board[i]!="") return;

  board[i]=current;

  if(checkWin()){
    document.getElementById("status").innerText=current+" Wins 🎉";
    return;
  }

  current = current==="X" ? "O" : "X";
  document.getElementById("status").innerText="Player "+current+" Turn";

  createGrid();
}

function checkWin(){
  const winPatterns=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  return winPatterns.some(pattern=>{
    const [a,b,c]=pattern;
    return board[a] && board[a]===board[b] && board[a]===board[c];
  });
}

function reset(){
  board=["","","","","","","","",""];
  current="X";
  document.getElementById("status").innerText="Player X Turn";
  createGrid();
}

createGrid();

</script>

</body>
</html>
